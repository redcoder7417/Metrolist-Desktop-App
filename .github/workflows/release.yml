name: Release Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Release Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: metrolist-web/package-lock.json

      - name: Build Kotlin Backend Fat JAR
        working-directory: metrolist-web/backend
        run: .\gradlew.bat shadowJar --no-daemon --console=plain

      - name: Install Dependencies & Package Windows Installer
        working-directory: metrolist-web
        run: |
          npm ci
          npm run electron:build:win

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-windows-installer
          path: |
            metrolist-web/release-new/**/Metrolist Setup *.exe
            metrolist-web/release-new/**/*.blockmap
            metrolist-web/release-new/**/latest.yml

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            metrolist-web/release-new/**/Metrolist Setup *.exe
            metrolist-web/release-new/**/*.blockmap
            metrolist-web/release-new/**/latest.yml
